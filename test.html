<!DOCTYPE html>
<html>
<head>
    <title>Supabase Test</title>
</head>
<body style="font-family: Arial; padding: 20px;">
    <h2>Supabase Connection Test</h2>
    <div id="result" style="padding: 15px; background: #f0f0f0; border-radius: 8px;">Testing...</div>

    <script>
        const SUPABASE_URL = "https://avcktyxixujsiqlygfuw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_bw7yXcQKAaYVtXWrGRlnzA_Q1PdiXer";

        fetch(`${SUPABASE_URL}/rest/v1/products?select=*`, {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            }
        })
        .then(res => {
            if (!res.ok) throw new Error("HTTP Error: " + res.status);
            return res.json();
        })
        .then(data => {
            document.getElementById("result").innerHTML = 
                "<b>✅ Connection OK!</b><br>Products milay: " + data.length + "<br><br>" +
                "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
        })
        .catch(err => {
            document.getElementById("result").innerHTML = 
                "<b style='color:red;'>❌ Error:</b> " + err.message;
        });
    </script>
</body>
</html>
